name: Build Signed Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 21 (Capacitor 7)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies and build web assets
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
          npx cap sync android

      - name: Build Android APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x android/gradlew
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release.keystore
            export ANDROID_KEYSTORE_PATH="../release.keystore"
            cd android
            ./gradlew assembleRelease
            cp app/build/outputs/apk/release/app-release.apk ../Equilibrium.apk
          else
            cd android
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../Equilibrium.apk
          fi

      - name: Publish direct Equilibrium.apk to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('Equilibrium {0}', github.ref_name) || 'Equilibrium — Ultima versione APK' }}
          body: |
            Scarica direttamente **`Equilibrium.apk`** qui sotto (nessun file ZIP) e installalo sul tuo dispositivo Android.
          files: Equilibrium.apk
          make_latest: true
